name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - run: dart analyze --fatal-infos --fatal-warnings
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart run test/all.dart
      - run: dart --enable-asserts run test/all.dart

      # The negative controls: a reader with one refusal rule deleted must
      # fail exactly the vectors conformance-controls/<rule>.expected names,
      # once per rule, and a vector whose operation has no runner must go red.
      # A gate nobody has seen go red is a claim, not a measurement.
      - name: Every conformance control fails exactly its expected vectors
        run: dart run tool/conformance_controls.dart

      # The web target: the corpus under dart2wasm, where Dart's int stays a
      # 64-bit integer, and dart2js refusing to build the library, since its
      # int is a JavaScript double that would round wide values.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: The corpus passes on the web target
        run: dart run tool/web_conformance.dart

      # The float/double write-then-read fuzz under dart2wasm: read finite
      # patterns, write them back, require the same bytes, with an integer
      # oracle. dart2wasm once flipped the quiet bit of an sNaN-shaped 32-bit
      # half (lib/src/float32.dart), which only the web target can show.
      - name: Float/double write-then-read fuzz on the web target
        run: dart run tool/web_float_fuzz.dart 1 1000000

  # The fuzz smoke: the C++ reference runs libFuzzer for 60 s on every push;
  # Dart has no native coverage-guided fuzzer, so this port runs the family's
  # differential instead (fuzz/differential_test.go, as serialize.lua,
  # serialize.luau and serialize.nut do): a Go host generates random programs
  # over every operation, serialize.go v2 (pinned in fuzz/go.mod) is the other
  # side, and the two writers must emit identical bytes, each reader must
  # decode the other's bytes, and on mutated and arbitrary bytes both readers
  # must agree on whether, where and why they stop. 60 s of rounds on the
  # fixed seed; .github/workflows/nightly-fuzz.yml runs it longer, on a seed
  # that changes every night. A functional test: it spawns the compiled Dart
  # driver, so it lives in its own job, never in test/all.dart.
  fuzz:
    name: fuzz (differential vs serialize.go, 60 s smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get
      - uses: actions/setup-go@v5
        with:
          go-version-file: fuzz/go.mod
          cache-dependency-path: fuzz/go.sum
      - name: go vet
        working-directory: fuzz
        run: go vet ./...
      - name: Fuzz smoke (60 s)
        working-directory: fuzz
        run: go test -count=1 -timeout 600s -run TestDifferentialAgainstSerializeGo -v . -duration 60s

      # A fuzzer nobody has seen go red is a claim: with the Go writer
      # widening every int range by one bit, the same differential must fail
      # by a disagreement.
      - name: Fuzz negative control (widened int must go red)
        run: tool/fuzz_negative_control.sh

  spec-sync:
    name: STANDARD.md and conformance/ match upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STANDARD.md and conformance/ here are VERBATIM VENDORED COPIES of the
      # wire-format specification and the shared conformance corpus that live
      # in mas-bandwidth/serialize. This job fails if they have diverged.
      #
      # Why vendor rather than link: an implementer wants the normative text
      # and the vectors beside the implementation, at the revision they are
      # reading. Why check: a duplicated normative document is the same
      # failure as a duplicated constant, except it drifts silently and the
      # ports are what break.
      #
      # If this fails, upstream changed. Read the diff, port whatever it
      # implies, then copy the new files across in the same commit.
      - name: Compare against mas-bandwidth/serialize
        # the listing below goes through the GitHub API, which is sharply
        # rate limited without a token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "upstream: mas-bandwidth/serialize@$(git ls-remote https://github.com/mas-bandwidth/serialize.git refs/heads/main | cut -f1)"
          curl -fsSL -o /tmp/upstream-STANDARD.md \
            https://raw.githubusercontent.com/mas-bandwidth/serialize/main/STANDARD.md
          if ! diff -u /tmp/upstream-STANDARD.md STANDARD.md; then
            echo "::error::STANDARD.md has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "STANDARD.md matches upstream"

          # enumerate upstream rather than iterating the vendored files, so a
          # vector file added upstream is a divergence here too
          mkdir -p /tmp/upstream-conformance
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mas-bandwidth/serialize/contents/conformance?ref=main \
            | jq -r '.[] | select(.type == "file") | .name' > /tmp/upstream-names
          test -s /tmp/upstream-names
          while read -r name; do
            curl -fsSL -o "/tmp/upstream-conformance/$name" \
              "https://raw.githubusercontent.com/mas-bandwidth/serialize/main/conformance/$name"
          done < /tmp/upstream-names
          if ! diff -ru /tmp/upstream-conformance conformance; then
            echo "::error::conformance/ has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "conformance/ matches upstream"

          # the negative controls' oracles: each .expected list names the
          # vectors a reader with that one rule deleted must fail
          mkdir -p /tmp/upstream-conformance-controls
          curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/mas-bandwidth/serialize/contents/conformance-controls?ref=main \
            | jq -r '.[] | select(.type == "file") | .name' > /tmp/upstream-control-names
          test -s /tmp/upstream-control-names
          while read -r name; do
            curl -fsSL -o "/tmp/upstream-conformance-controls/$name" \
              "https://raw.githubusercontent.com/mas-bandwidth/serialize/main/conformance-controls/$name"
          done < /tmp/upstream-control-names
          if ! diff -ru /tmp/upstream-conformance-controls conformance-controls; then
            echo "::error::conformance-controls/ has diverged from mas-bandwidth/serialize"
            exit 1
          fi
          echo "conformance-controls/ matches upstream"

  # The port exists to be wire compatible; everything else is detail. This job is
  # the only place that claim is MEASURED against the reference itself: the exact
  # release candidate in this repository exchanges bytes with the exact C++
  # library, in both directions, on every push and pull request. Nothing here is a
  # local one-off, and no expectation is regenerated from this port's own codec.
  #
  # What is exchanged: interop/interop.dart and interop/interop.cpp serialize the
  # SAME boundary message -- every operation STANDARD.md defines, at the values
  # where implementations disagree. Both halves write it and the files must be
  # byte identical; each half then decodes the other's file, checks every value
  # and re-encodes it byte for byte. Then the hostile half: every proper prefix of
  # the other's stream is a truncated stream and both must refuse it, and both run
  # the shared conformance corpus, where the refusal vectors are the point.
  #
  # THE FAMILY PIN -- ONE POLICY, ONE VERSION. The C++ checkout is pinned to a
  # RELEASED tag of mas-bandwidth/serialize, never main, and to the SAME tag in
  # every port's wire-compat gate, so "compatible with C++" means the same thing
  # in all of them. Never main, because an upstream merge mid-day must not change
  # what a commit's CI proves. Find the newest tag with:
  #   gh release list --repo mas-bandwidth/serialize --limit 1
  # Bump family-wide, deliberately, in its own commit per repo. SERIALIZE_TAG
  # below is the ONE place this repository names a version of the reference, and
  # ONE pin is the whole point: the wire exchange and the conformance corpus are
  # held to the same release, so the reference reader driving the corpus is the
  # reference library the bytes are exchanged with. A release whose corpus this
  # repository has not vendored fails the diff below rather than passing on a
  # second, looser pin.
  # (The spec-sync job above deliberately stays on upstream main: drift DETECTION
  # is that job's whole purpose.)
  interop:
    name: interop with the C++ reference
    runs-on: ubuntu-24.04
    env:
      SERIALIZE_TAG: v2.1.1
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2
      - run: dart pub get

      - name: Check out the C++ reference at the pinned release
        run: git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git /tmp/cpp-serialize

      # The corpus vendored here must be the one the pinned release carries: the
      # corpus and the runner that can drive it are one artifact, and a reference
      # reader older than the corpus cannot drive vectors whose operations it has
      # no code for. STANDARD.md requires that to be red rather than skipped, so
      # it is checked here rather than assumed.
      - name: The vendored corpus is the pinned release's corpus
        run: |
          diff -u /tmp/cpp-serialize/STANDARD.md STANDARD.md
          diff -ru /tmp/cpp-serialize/conformance conformance
          diff -ru /tmp/cpp-serialize/conformance-controls conformance-controls

      # Asserts stay ON (no -DNDEBUG): they are the C++ half of "API misuse
      # panics", and the degenerate ranges the message carries must pass with the
      # library's own checks enabled rather than around them. No -ffp-contract=off
      # either: the compressed float arithmetic is pinned in the library's source,
      # and building with default flags proves that rather than masking it.
      - name: Build the C++ halves against the pinned library
        run: |
          c++ -O2 -std=c++17 -Wall -I /tmp/cpp-serialize -o /tmp/cpp_interop interop/interop.cpp
          c++ -O2 -std=c++17 -Wall -I /tmp/cpp-serialize -o /tmp/cpp_conformance /tmp/cpp-serialize/conformance.cpp

      - name: Both halves write byte identical wire data
        run: |
          /tmp/cpp_interop write /tmp/cpp.bin
          dart run interop/interop.dart write /tmp/dart.bin
          cmp /tmp/cpp.bin /tmp/dart.bin

      # and each requires the other's bytes with one byte appended to be
      # refused at the message's end, as trailing_data
      - name: Each half decodes the other's bytes and re-encodes them exactly
        run: |
          dart run interop/interop.dart read /tmp/cpp.bin
          /tmp/cpp_interop read /tmp/dart.bin

      # asserts on: the read side must refuse hostile data by CHECKING, and a
      # refusal that only held under --enable-asserts would be a release-mode hole
      - name: Both halves refuse every truncation of the other's stream
        run: |
          dart run interop/interop.dart refuse /tmp/cpp.bin
          /tmp/cpp_interop refuse /tmp/dart.bin

      # The corpus is the family's one conformance instrument, and its refusal
      # vectors are what this step is for: the reference reader and this port's
      # reader are held to the same accepts and the same refusals, from the same
      # vendored files. The spec-sync job above proves those files match upstream,
      # and the step above proves they are the pinned release's own corpus, which
      # is what the reference reader here was built from.
      - name: Both halves run the shared conformance corpus
        run: |
          /tmp/cpp_conformance conformance/*.txt
          dart run test/conformance_test.dart
